dataset: lsui
training:
  input_dir: datasets/lsui/train/input
  label_dir: datasets/lsui/train/gt
  test_input_dir: datasets/lsui/test/lsui-input-256
  test_label_dir: datasets/lsui/test/lsui-gt-256
  csv_path: degradation_labels/lsui/degradation_labels.csv
  save_dir: outputs/lsui/weights
  result_dir: outputs/lsui/training_images
  pretrained_weight_path: null
  batch_size: 4
  lr_base: 0.0002
  epochs: 1000
  seed: 42
  model_save_every: 10
  image_save_every: 10
  lambda_ssim: 0.2
  lambda_spb: 0.3
  lambda_scb: 0.3
  guide_start: 0.3
  guide_end: 0.0
  entropy_start: 0.05
  entropy_end: 0.001
  warmup_epochs: 50
  guide_epochs: 200
  use_dsos_alternating: true
  dsos_cycle_epochs: 20
  high_precision_modules:
  - spb.t_head
  - spb.veil_head
  - scb.alpha_head
  - scb.spec_head
  - sfm
  - recon
  low_precision_modules:
  - shared_stem
  - spb.backbone
  - scb.backbone
  - enc_spb
  - enc_scb
  weight_decay: 0.0001
  lr_min: 1.0e-06
  T_0: 100
  T_mult: 2
  ema_decay: 0.999
  precision_shared_stem: int4
  precision_expert_backbone: binary
  precision_encoder: int8
  precision_sfm: int8
  precision_recon: int8
  auto_resume: true
  resume_path: null
  resume_strict: true
  resume_rng_state: true
  checkpoint_save_every: 1
  checkpoint_backup_every: 50
checkpoint: checkpoints/lsui/best_model_ema.pth
stage01:
  input_dir: datasets/lsui/train/input
  output_dir: outputs/lsui/degradation_labels
evaluation:
  TEST_INPUT_DIR: datasets/lsui/test/lsui-input-256
  TEST_LABEL_DIR: datasets/lsui/test/lsui-gt-256
  SAVE_PATH: outputs/lsui/evaluation/results.txt
  image_dir: outputs/lsui/test_images
  INPUT_SIZE:
  - 1
  - 9
  - 256
  - 256
  FPS_WARMUP: 50
  FPS_ITERS: 1000
